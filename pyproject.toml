[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperer"
version = "2.0.0"
description = "Desktop dictation and quick screen recordings with webcam and microphone."
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "openai>=1.30",
    "pynput",
    "pyperclip",
    "sounddevice",
    "soundfile",
    "mss>=10.2,<11",
    "opencv-python>=4.10,<6",
    "Pillow>=10",
    "imageio-ffmpeg>=0.6,<0.7",
]

[project.optional-dependencies]
local = ["faster-whisper"]

[project.scripts]
whisperer = "whisperer.app:main"

[tool.setuptools.packages.find]
include = ["whisperer*"]
